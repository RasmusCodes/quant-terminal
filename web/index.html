<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RTS Quant Terminal</title>
  <meta name="description" content="Research, quant experiments, signals, portfolio and risk across every project, kept up to date automatically.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231a1a19'/%3E%3Cpath d='M6 22l6-7 5 4 9-11' stroke='%233987e5' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script>try{var t=localStorage.getItem('rts-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="brand"><span class="logo" aria-hidden="true"></span><span>RTS<b>QT</b></span><span class="mode" id="mode-badge"></span></div>
    <form class="cmd" id="cmd" role="search" autocomplete="off">
      <span class="cmd-key" aria-hidden="true">/</span>
      <input id="cmd-input" type="search" placeholder="Search everything, or ask: “what evidence contradicts my NFLX thesis?”" aria-label="Search or ask">
      <button type="submit" class="btn">Ask</button>
    </form>
    <div class="top-actions">
      <button class="iconbtn" id="alerts-btn" title="Research assistant alerts" aria-label="Alerts"><span class="dot" id="alerts-dot"></span>⚑ <span id="alerts-count">0</span></button>
      <button class="iconbtn" id="theme-btn" title="Toggle light/dark" aria-label="Toggle theme">◐</button>
    </div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Sections">
    <a href="#/overview" data-tab="overview">Overview</a>
    <a href="#/research" data-tab="research">Research</a>
    <a href="#/quant" data-tab="quant">Quant</a>
    <a href="#/altdata" data-tab="altdata">Alt Data</a>
    <a href="#/markets" data-tab="markets">Markets</a>
    <a href="#/portfolio" data-tab="portfolio">Portfolio</a>
    <a href="#/risk" data-tab="risk">Risk</a>
    <a href="#/registry" data-tab="registry">Registry</a>
    <a href="#/search" data-tab="search">Search</a>
    <a href="#/settings" data-tab="settings">Settings</a>
  </nav>
  <main id="main" tabindex="-1"><div class="loading">Loading…</div></main>
  <aside class="drawer" id="drawer" aria-hidden="true"><div class="drawer-inner" id="drawer-inner"></div></aside>
  <div class="scrim" id="scrim"></div>
  <footer class="statusbar" id="statusbar"></footer>
  <div class="tooltip" id="tooltip" role="tooltip"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
