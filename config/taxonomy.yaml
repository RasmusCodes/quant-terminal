  alt_data:
    label: Alternative data
    tab: altdata
    investment: true
    subtopics:
      alt_data:
        label: Alternative data pipelines
        terms: ["alternative data^3", "alternative-data^3", "alt-data^3", "alt data^3", "point-in-time^1", "nowcast*^2", "web scrap*^2", "google trends^2", "job posting*^2", "hiring^1", "web traffic^2", "app download*^2", "satellite^1", "import record*^2", "customs^1", "bill of lading^2", "shipment*^1"]
      procurement:
        label: Government procurement
        terms: ["procurement^3", "usaspending^3", "CS:FPDS^3", "sam.gov^3", "government contract*^3", "contract award*^2", "legistar^3", "council approval*^2", "solicitation*^2", "socrata^2"]
      deal_tracking:
        label: Deal & commercial-event tracking
        terms: ["deal tracking^3", "deal-tracking^3", "design win*^3", "commercial event*^3", "contract win*^2", "customer win*^2", "materiality^1"]
      industrial:
        label: Industrial intelligence
        terms: ["industrial intelligence^3", "equipment demand^3", "machinery^1", "construction^1", "mining^1", "dealer inventor*^3", "backlog^1", "rig count*^2", "freight^1"]
      data_center:
        label: Data-center infrastructure
        terms: ["data center*^2", "data-center*^2", "datacenter*^2", "hyperscaler*^2", "neocloud*^3", "colocation^2", "megawatt*^1", "power demand^2", "interconnection^1", "gpu cloud^3"]
      semis_forecasting:
        label: Semiconductor revenue forecasting
        terms: ["revenue forecast*^3", "earnings forecast*^2", "management guidance^2", "guidance^1", "beat^1", "xbrl^2", "8-k^1", "semiconductor*^1"]
      filings_text:
        label: Filings & text mining
        terms: ["sec edgar^2", "edgar^1", "10-k^1", "10-q^1", "form 4^2", "13f^2", "insider purchase*^3", "insider trad*^2", "text mining^2", "risk factor*^1", "loughran^3"]

  equity_research:
    label: Equity research & valuation
    tab: research
    investment: true
    subtopics:
      memos:
        label: Investment memos & theses
        terms: ["investment memo^3", "investment thesis^3", "price target^3", "short thesis^3", "long thesis^3", "bull case^2", "bear case^2", "base case^1", "variant view^3", "pitch^1", "stock pitch^3", "recommendation^1", "catalyst*^1", "deep dive^2", "stock report^3"]
      valuation:
        label: Valuation models
        terms: ["CS:DCF^3", "discounted cash flow^3", "CS:WACC^3", "terminal value^2", "fair value^2", "intrinsic value^2", "ev/ebitda^2", "comparable compan*^3", "comps^2", "valuation^2", "reverse dcf^3", "sum-of-the-parts^3", "CS:SOTP^3", "operating model^3", "financial model^2"]
      earnings:
