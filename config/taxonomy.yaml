        label: Sector & industry research
        terms: ["CS:TAM^2", "market share^2", "competitive landscape^2", "supply chain^1", "industry structure^2", "end market*^2", "sector research^3"]
      event_driven:
        label: Event-driven
        terms: ["event-driven^3", "event driven^3", "merger arb*^3", "spin-off^2", "spinoff^2", "activist^2", "restructuring^1", "launch event^1"]

  portfolio:
    label: Portfolio & personal investing
    tab: portfolio
    investment: true
    subtopics:
      holdings:
        label: Holdings & performance
        terms: ["portfolio^1", "holdings^2", "time-weighted return^3", "CS:TWR^3", "brokerage^2", "nordnet^3", "revolut^2", "allocation^1", "rebalanc*^2", "investment tracking^3", "stock screener^2"]
      risk:
        label: Portfolio risk
        terms: ["value at risk^3", "CS:VaR^3", "expected shortfall^3", "CS:CVaR^3", "stress test*^2", "scenario analysis^2", "concentration^1", "factor exposure*^3", "risk budget*^2"]
