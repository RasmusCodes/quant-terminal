# Classification vocabulary. Generic domain terms only: nothing here names a specific project.
# Term syntax: "phrase" (weight 1), "phrase^3" (weight 3), "prefix*" (prefix match), "CS:Token" (case-sensitive).
# A project's category scores come from these terms in its name, description, README, document headings,
# file names and code imports; the evidence (top terms) is stored with every classification.

categories:
  quant_trading:
    label: Quant trading & microstructure
    tab: quant
    investment: true
    subtopics:
      microstructure:
        label: HFT & market microstructure
        terms: ["market microstructure^3", "microstructure^2", "limit order book^3", "order book^2", "matching engine^3", "high-frequency^3", "high frequency trading^3", "CS:HFT^3", "queue position^2", "latency^1", "CS:ITCH^3", "lobster^2", "tick data^2", "price-time priority^3", "exchange simulator^3", "discrete-event^2"]
      order_routing:
        label: Smart order routing
        terms: ["smart order rout*^3", "order router^3", "order routing^3", "venue selection^2", "best execution^2", "fill probability^2", "CS:SOR^2"]
      market_making:
        label: Market making
        terms: ["market making^3", "market-making^3", "market maker^3", "avellaneda^3", "stoikov^3", "inventory risk^2", "quoting^2", "spread capture^2", "adverse selection^2"]
      stat_arb:
        label: Statistical arbitrage
        terms: ["statistical arbitrage^3", "stat arb^3", "statarb^3", "pairs trading^3", "cointegration^3", "mean reversion^2", "mean-reversion^2", "market-neutral^2", "market neutral^2", "residual momentum^3", "kalman^1"]
      rl_trading:
        label: Reinforcement-learning trading
        terms: ["reinforcement learning^3", "reinforcement-learning^3", "CS:PPO^2", "CS:DQN^2", "CS:SAC^1", "policy gradient^2", "trading environment^2", "rl agent*^3"]
      prediction_markets:
        label: Prediction markets
        terms: ["prediction market*^3", "kalshi^3", "polymarket^3", "event contract*^2", "lmsr^3", "binary contract*^2"]
      sports_betting:
        label: Sports betting models
        terms: ["sports betting^3", "sportsbook*^3", "closing line^3", "moneyline^3", "point spread^2", "player props^2", "betting market*^3", "CS:NBA^1", "CS:NFL^1", "elo rating*^1"]
      relative_value:
        label: Cross-asset relative value
        terms: ["relative value^3", "relative-value^3", "cross-asset^2", "basis trade^2", "carry trade^2", "spread trade*^2", "rich/cheap^2"]
      execution:
        label: Execution research
        terms: ["execution^1", "transaction cost*^2", "market impact^2", "implementation shortfall^3", "CS:VWAP^2", "CS:TWAP^2", "slippage^2", "almgren^3", "square-root impact^2"]
      factors:
        label: Factor & systematic equity
        terms: ["factor investing^3", "fama-french^3", "fama french^3", "momentum^1", "quality factor^2", "value factor^2", "profitability premium^3", "cross-sectional^2", "long-short^2", "long/short^2", "smart beta^2"]
      alpha_combination:
        label: Alpha & signal combination
        terms: ["alpha combination^3", "signal combination^3", "combining signals^3", "forecast combination^3", "alpha signal*^2", "information coefficient^3", "CS:IC-weight*^3", "ic-weighted^3", "bayesian model averaging^3", "CS:BMA^2", "elastic net^2", "shrinkage^1", "ensemble^1", "signal weights^2", "alpha research^3"]
      backtesting:
        label: Backtesting & validation
        terms: ["backtest*^2", "walk-forward^2", "out-of-sample^2", "sharpe^1", "drawdown^1", "holdout^1", "systematic trading^3", "trading strateg*^2", "paper trad*^2"]

  derivatives:
    label: Derivatives, rates & credit
    tab: markets
    investment: true
    subtopics:
      options_pricing:
        label: Options pricing
        terms: ["option pricing^3", "options pricing^3", "black-scholes^3", "black scholes^3", "CS:BSM^3", "binomial tree*^2", "american option*^3", "implied volatility^2", "greeks^2", "exotic option*^2", "barrier contract*^2", "derivatives exchange^3"]
      vol_surfaces:
        label: Volatility surfaces
        terms: ["volatility surface*^3", "vol surface*^3", "CS:SVI^3", "CS:SSVI^3", "CS:SABR^3", "heston^3", "local vol*^2", "volatility smile^3", "skew^1"]
      vol_forecasting:
        label: Volatility forecasting
        terms: ["volatility forecast*^3", "realized volatility^3", "realised volatility^3", "CS:GARCH^3", "CS:HAR^2", "CS:VIX^2", "CS:VVIX^2", "variance risk premium^3", "earnings volatility^2"]
      options_strategies:
        label: Options strategies & risk
        terms: ["straddle*^2", "strangle*^2", "iron condor*^3", "covered call*^2", "variance swap*^3", "options strateg*^3", "delta-hedg*^2", "delta hedg*^2", "portfolio greeks^2"]
      fixed_income:
        label: Fixed income & rates
        terms: ["fixed income^3", "fixed-income^3", "yield curve^3", "treasury^1", "treasuries^2", "duration^1", "convexity^1", "swap spread*^3", "nelson-siegel^3", "term premium^3", "rates^1", "butterfl*^1"]
      credit:
