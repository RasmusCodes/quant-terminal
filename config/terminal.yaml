# RTS HF quant terminal - default settings.
# This file is public-safe: it holds no paths, names of private repositories or credentials.
# Machine-specific settings go in config/local.yaml (git-ignored), which is merged over this file.

github:
  owner: RasmusCodes            # every repository of this account is discovered automatically
  include_forks: false
  clone_depth: 1                # shallow, partial clones in data/cache/repos (never pushed anywhere)
  max_blob_mb: 8                # blobs above this size are not downloaded
  # Private repositories are read only in private (local) mode, through the GitHub CLI's existing login.

website:
  url: https://rasmuscodes.github.io
  # The site's local source folder is found automatically: a workspace project whose site.yaml has this url.

workspace:
  # Folders whose sub-folders are projects. Relative paths are resolved from the folder that holds this
  # repository, so the defaults cover the folder next to the terminal and the one above it.
  roots: [".", ".."]
  exclude: []                   # sub-folder names to skip entirely
  index_document_libraries: false   # folders that hold only third-party PDFs (e.g. broker research) are listed, not indexed

sync:
  interval_hours: 2             # local scheduled task cadence (Windows Task Scheduler)
  public_interval_hours: 6      # GitHub Actions cadence for the public build
  stale_after_hours: 26         # a source without a successful sync for this long is flagged
  max_files_per_project: 4000   # files examined per project per sync (data folders are pruned first)

search:
  dense_dims: 192               # latent semantic dimensions for the dense half of hybrid search
  max_chunk_chars: 1400

llm:
  enabled: auto                 # auto: answers are synthesised by Claude when credentials exist, else extractive only
  model: claude-opus-5-5
  effort: medium

portfolio:
  base_currency: EUR
  benchmark: VWCE               # used when a portfolio does not name one
  risk_lookback_days: 504       # about two years of daily returns
  var_levels: [0.95, 0.99]
  price_source: yahoo           # yahoo chart API, cached; the website's own price cache is reused first
  live_trading: false           # there is no live broker connector; see docs/OPERATIONS.md

server:
  host: 127.0.0.1
  port: 8811
